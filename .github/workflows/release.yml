name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.mjs
      - name: Compute tag
        id: tag
        run: echo "version=v$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.tag.outputs.version }}" > /dev/null; then
            echo "Tag already exists; nothing to release"
            exit 0
          fi
          git tag "${{ steps.tag.outputs.version }}"
          git push origin "${{ steps.tag.outputs.version }}"
          gh release create "${{ steps.tag.outputs.version }}" --generate-notes